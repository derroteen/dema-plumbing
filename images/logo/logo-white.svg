<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Dema Plumbing and Pipe Fitting Eldoret logo">
  <title>Dema Plumbing and Pipe Fitting Eldoret</title>
  <desc>Circular badge logo with faucet and water drop design</desc>

  <!-- Clip path for waves -->
  <clipPath id="innerCircleClip">
    <circle cx="100" cy="100" r="86" />
  </clipPath>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Decorative dots on sides -->
  <circle cx="9"  cy="100" r="3.5" fill="#FFFFFF"/>
  <circle cx="191" cy="100" r="3.5" fill="#FFFFFF"/>

  <!-- Paths for text -->
  <defs>
    <path id="topArc" d="M 22,100 A 78,78 0 0,1 178,100" fill="none" />
    <path id="bottomArc" d="M 18,112 A 84,84 0 0,0 182,112" fill="none" />
  </defs>

  <!-- DEMA text arced along the top -->
  <text font-family="'Inter', 'Arial', 'Helvetica', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">DEMA</textPath>
  </text>

  <!-- PLUMBING ENTERPRISE text arced along the bottom -->
  <text font-family="'Inter', 'Arial', 'Helvetica', sans-serif" font-weight="700" font-size="11.5" fill="#FFFFFF" letter-spacing="2.2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">PLUMBING ENTERPRISE</textPath>
  </text>

  <!-- Clean modern water waves below the faucet (clipped inside the inner circle) -->
  <g clip-path="url(#innerCircleClip)">
    <!-- Bottom wave -->
    <path d="M 10,165 Q 55,145 100,165 Q 145,185 190,165 L 190,200 L 10,200 Z" fill="#FFFFFF" opacity="1.0" />
    <!-- Top wave -->
    <path d="M 10,152 Q 55,172 100,152 Q 145,132 190,152 L 190,200 L 10,200 Z" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Official Faucet Icon -->
  <image href="data:image/png;base64," x="67.5" y="54.0" width="65.0" height="50.6" />

  <!-- Single water droplet beneath the faucet spout nozzle -->
  <path d="M 125.6,105.0 C 125.6,105.0 122.1,113 122.1,118.5 A 3.5,3.5 0 0 0 129.1,118.5 C 129.1,113 125.6,105.0 125.6,105.0 Z" fill="#FFFFFF" />
</svg>
