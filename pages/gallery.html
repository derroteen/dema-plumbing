<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery - Dema Plumbing and Pipe Fitting Eldoret</title>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <!-- NAV -->
  <nav>
    <div class="logo">DEMA<span>.</span></div>
    <ul class="nav-links">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/about/index.html">About</a></li>
      <li><a href="/services/index.html">Services</a></li>
      <li><a href="/gallery.html">Gallery</a></li>
      <li><a href="/contact/index.html">Contact</a></li>
    </ul>
    <button class="nav-cta" onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'})">Get a Quote</button>
  </nav>

  <!-- HERO -->
  <section class="hero" id="gallery">
    <div class="hero-text">
      <div class="hero-badge">📸 Professional Projects</div>
      <h1>Our Completed Projects</h1>
      <p>Explore our high-quality plumbing work across residential and commercial properties.</p>
      <div class="hero-btns">
        <a href="/gallery.html" class="btn-primary">View All</a>
      </div>
    </div>
  </section>

  <!-- GALLERY GRID -->
  <section id="gallery-container" class="gallery-grid">
    <!-- Images will be inserted here dynamically -->
  </section>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" style="display:none;">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" src="" alt="Gallery Image"/>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // Gallery data - add image filenames to this array when you add new images
    const galleryImages = [
      'bathroom1.jpg',
      'bathroom2.jpg',
      'kitchen1.jpg',
      'kitchen2.jpg',
      'pipe1.jpg',
      'pipe2.jpg',
      'tank1.jpg',
      'drainage1.jpg',
      'before-after1.jpg',
      // Add new image filenames here
    ];

    // Dynamic gallery generation
    const container = document.getElementById('gallery-container');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.querySelector('.lightbox-content');
    const closeBtn = document.querySelector('.lightbox-close');

    galleryImages.forEach(src => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      const link = document.createElement('a');
      link.href = `/images/gallery/\${src}`;
      link.dataset.lightboxsrc = \`/images/gallery/\${src}\`;
      
      const img = document.createElement('img');
      img.src = \`/images/gallery/\${src}\`;
      img.alt = \`Project photo \${src}\`;
      img.loading = 'lazy';
      img.decoding = 'async';
      
      link.appendChild(img);
      
      // Lightbox click handler
      link.addEventListener('click', function(e) {
        e.preventDefault();
        lightboxImg.src = this.dataset.lightboxsrc;
        lightbox.style.display = 'flex';
      });
      
      item.appendChild(link);
      container.appendChild(item);
    });

    // Lightbox close
    closeBtn.addEventListener('click', function() {
      lightbox.style.display = 'none';
      lightboxImg.src = '';
    });

    // Close lightbox when clicking outside the content
    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox) {
        lightbox.style.display = 'none';
        lightboxImg.src = '';
      }
    });
  </script>
</body>
</html>
